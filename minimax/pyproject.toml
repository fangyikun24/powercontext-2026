[project]
name = "sdd-context"
version = "1.0.0"
description = "Spec-driven development context manager for AI coding assistants"
requires-python = ">=3.11"
dependencies = [
    "powercontext[seekdb]==1.4.1",
    "pylibseekdb>=1.4.0.post1",
]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdd_context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
