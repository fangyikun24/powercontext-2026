kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables:
    - id: POWERCONTEXT_URL
      name: POWERCONTEXT_URL
      value: http://127.0.0.1:8000
      value_type: string
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    suggested_questions:
      - 会飞的冰箱
      - 周一的早晨
      - 手机充电
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
      - data:
          desc: 输入任意主题，AI 生成 3 个离谱但自洽的创意脑洞
          title: 开始
          type: start
          variables:
            - label: 主题
              max_length: 200
              options: []
              required: true
              type: paragraph
              variable: topic
          output_variables: []
        id: start
        position:
          x: 100
          y: 300
        type: custom
        width: 244
        height: 90
      - data:
          desc: 从 PowerContext 检索历史脑洞（记忆复用），返回相关记录
          title: 检索历史脑洞（PowerContext）
          type: http-request
          url: http://127.0.0.1:8000/v1/memory/search
          method: post
          headers: '{"Content-Type": "application/json"}'
          params: ""
          body:
            type: json
            data: |
              {
                "scope_id": "project:dify-idea-engine",
                "query": "{{#start.topic#}}",
                "limit": 5
              }
          timeout:
            max_connect_timeout: 5
            max_read_timeout: 10
            max_write_timeout: 10
          authorization:
            type: no-auth
          output_variable: memory_hits
        id: memory_retrieve
        position:
          x: 400
          y: 300
        type: custom
        width: 244
        height: 120
      - data:
          desc: 生成 3 个离谱但自洽的创意方案
          title: 脑洞生成
          type: llm
          context:
            enabled: false
            variable_selector: []
          model:
            completion_params:
              max_tokens: 1500
              temperature: 0.8
            mode: chat
            name: gpt-4o-mini
            provider: openai
          prompt_template:
            - id: system-prompt
              role: system
              text: |
                你是「脑洞制造机」：给定主题，输出 3 个「离谱但自洽」的创意方案。
                每个创意：名称 + 一句话玩法/原理 + 为什么有趣。用简洁中文，编号 1/2/3。
                如果检索到历史脑洞（见【历史记忆】），避免重复并在此基础上续写。
            - id: user-prompt
              role: user
              text: |
                主题：{{#start.topic#}}

                【历史记忆】
                {{#memory_retrieve.body#}}

                请开始。
          vision:
            enabled: false
          variables: []
        id: llm_generate
        position:
          x: 700
          y: 300
        type: custom
        width: 244
        height: 120
      - data:
          desc: 把本次生成的脑洞保存到 PowerContext 记忆
          title: 保存脑洞到 PowerContext
          type: http-request
          url: http://127.0.0.1:8000/v1/memory/remember
          method: post
          headers: '{"Content-Type": "application/json"}'
          params: ""
          body:
            type: json
            data: |
              {
                "scope_id": "project:dify-idea-engine",
                "kind": "idea",
                "text": "主题：{{#start.topic#}} 生成：{{#llm_generate.text#}}"
              }
          timeout:
            max_connect_timeout: 5
            max_read_timeout: 10
            max_write_timeout: 10
          authorization:
            type: no-auth
          output_variable: save_result
        id: memory_save
        position:
          x: 1000
          y: 300
        type: custom
        width: 244
        height: 120
      - data:
          desc: 输出创意与记忆状态
          title: 直接回复
          type: answer
          answer: |
            {{#llm_generate.text#}}

            ---
            （本次脑洞已保存到 PowerContext 记忆；下次输入相近主题时会在此基础上续写。）
          variables: []
        id: answer
        position:
          x: 1300
          y: 300
        type: custom
        width: 244
        height: 90
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: http-request
          id: start-source-memory_retrieve-target
          source: start
          sourceHandle: source
          target: memory_retrieve
          targetHandle: target
          type: custom
          zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: llm
          id: memory_retrieve-source-llm_generate-target
          source: memory_retrieve
          sourceHandle: source
          target: llm_generate
          targetHandle: target
          type: custom
          zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: http-request
          id: llm_generate-source-memory_save-target
          source: llm_generate
          sourceHandle: source
          target: memory_save
          targetHandle: target
          type: custom
          zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: answer
          id: memory_save-source-answer-target
          source: memory_save
          sourceHandle: source
          target: answer
          targetHandle: target
          type: custom
          zIndex: 0
  settings:
    error_strategy: fail-branch
    tool_call_permits: []
    workflow_permits: []
    system_variables: []
