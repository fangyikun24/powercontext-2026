# Dify DSL —— 脑洞制造机（Idea Engine）
# 赛道：Dify —— Just for Fun：好玩的智能应用
# 应用类型：工作流（Workflow）
# 说明：本 DSL 可在 Dify 云端版直接导入运行。核心流程：
#   start(主题) → memory 节点(PowerContext HTTP 检索历史脑洞，记忆复用) → LLM(生成3个脑洞创意)
#   → 保存到 PowerContext 记忆(HTTP) → end(输出)
# 注意：DSL 中的 HTTP 节点地址/鉴权按你的环境修改；未配置 PowerContext 时可把 memory 节点设为可选/跳过。

app:
  version: 0.1.0
  name: 脑洞制造机 Idea Engine
  description: 输入一个主题，AI 给你 3 个离谱又合理的神奇脑洞。结合 PowerContext 记忆，灵感可持续复用。
  mode: workflow
  workflow:
    graph:
      nodes:
        - id: start
          type: start
          data:
            title: 开始
            variables:
              - variable: topic
                label: 主题
                type: paragraph
                required: true
                max_length: 200
            output_variables: []

        - id: memory_retrieve
          type: http-request
          data:
            title: 检索历史脑洞（PowerContext 记忆复用）
            method: post
            url: http://127.0.0.1:8000/v1/memory/search
            headers: '{"Content-Type": "application/json"}'
            params: ''
            body:
              type: json
              data: |
                {
                  "scope_id": "project:dify-idea-engine",
                  "query": "{{#start.topic#}}",
                  "limit": 5
                }
            timeout: 10
            output_variable: memory_hits
          position:
            x: 120
            y: 220

        - id: llm_generate
          type: llm
          data:
            title: 生成脑洞创意
            model:
              provider: __env__  # 由 Dify 运行时模型提供商决定（如 OpenAI/deepseek/本地）
              name: __env__
            prompt_template:
              - role: system
                text: |
                  你是「脑洞制造机」：给定主题，输出 3 个「离谱但自洽」的创意方案。
                  每个创意：名称 + 一句话玩法/原理 + 为什么有趣。用简洁中文，编号 1/2/3。
                  如果检索到历史脑洞（见【历史记忆】），避免重复并在此基础上续写。
              - role: user
                text: |
                  主题：{{#start.topic#}}

                  【历史记忆】
                  {{#memory_retrieve.body#}}

                  请开始。
            variables:
              - variable: memory_retrieve.body
                value_selector:
                  - memory_retrieve
                  - body
            outputs: []
          position:
            x: 360
            y: 220

        - id: memory_save
          type: http-request
          data:
            title: 保存本次脑洞（PowerContext 记忆）
            method: post
            url: http://127.0.0.1:8000/v1/memory/remember
            headers: '{"Content-Type": "application/json"}'
            params: ''
            body:
              type: json
              data: |
                {
                  "scope_id": "project:dify-idea-engine",
                  "kind": "idea",
                  "text": "主题：{{#start.topic#}} 生成：{{#llm_generate.text#}}"
                }
            timeout: 10
            output_variable: save_result
          position:
            x: 600
            y: 220

        - id: end
          type: end
          data:
            title: 输出创意
            output_variables:
              - variable: result
                value_selector:
                  - llm_generate
                  - text
              - variable: memory_note
                value_selector:
                  - memory_save
                  - body
          position:
            x: 840
            y: 220

      edges:
        - source: start
          target: memory_retrieve
          id: e1
        - source: memory_retrieve
          target: llm_generate
          id: e2
        - source: llm_generate
          target: memory_save
          id: e3
        - source: memory_save
          target: end
          id: e4

    features:
      file_upload:
        enabled: false
      opening_statement: ""
      suggested_questions: []
      speech_to_text:
        enabled: false
      text_to_speech:
        enabled: false
      retriever_resource:
        enabled: false
      sensitive_word_avoidance:
        enabled: false

    settings:
      error_strategy: fail-branch
      conversation_variables: []
    environment:
      context:
        enabled: false
      history:
        enabled: false
